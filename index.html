<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GemKorea — 대한민국 역사 여행 지도</title>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=y60jsyh564&submodules=geocoder"></script>
<style>
:root {
  --bg:#f9f7f4; --surface:#fff; --border:#e4dfd6;
  --text:#1a1612; --muted:#8a8278;

  /* GemKorea 새 브랜드 컬러 */
  --gem:#1e3a8a;        /* 딥 네이비 (한국 쪽빛) */
  --gem-soft:#e8eef8;
  --gold:#c8860a;       /* 앰버 골드 */
  --gold-soft:#fef3e0;
  --brown:#7c5c3a;
  --brown-soft:#f5ede4;
  --green:#4a8c5c;
  --green-soft:#e8f5ee;
  --red:#c0392b;
  --red-soft:#fdf0ee;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:15px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── 헤더 ── */
header{
  background:var(--surface);border-bottom:1.5px solid var(--border);
  padding:0 22px;z-index:300;flex-shrink:0;
  display:flex;align-items:center;height:56px;gap:16px;
}
.logo{
  font-size:20px;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(135deg,#1e3a8a,#c8860a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  flex-shrink:0;
}
.logo small{font-size:10px;-webkit-text-fill-color:var(--muted);display:block;letter-spacing:2px;margin-top:-3px;}
.search-wrap{
  display:flex;align-items:center;gap:8px;
  background:var(--bg);border:1.5px solid var(--border);border-radius:22px;
  padding:7px 15px;flex:1;max-width:260px;
}
.search-wrap input{border:none;background:none;outline:none;font-size:13px;width:100%;color:var(--text);}
.admin-link{
  font-size:12px;color:var(--muted);text-decoration:none;
  padding:6px 12px;border:1.5px solid var(--border);border-radius:9px;
  margin-left:auto;flex-shrink:0;background:var(--surface);font-weight:600;
}
.admin-link:hover{color:var(--gem);border-color:var(--gem);}

/* ── 필터 영역 ── */
.filter-area{
  background:var(--surface);border-bottom:1.5px solid var(--border);
  flex-shrink:0;z-index:200;
}
.filter-row{
  display:flex;align-items:center;gap:7px;
  padding:7px 18px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;min-height:42px;
}
.filter-row:last-child{border-bottom:none;}
.filter-label{
  font-size:11px;font-weight:800;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;
  min-width:54px;flex-shrink:0;
}
.f-btn{
  padding:5px 13px;border-radius:16px;
  border:1.5px solid var(--border);background:var(--surface);
  font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);
  transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.f-btn:hover{border-color:var(--gem);color:var(--gem);}
.f-btn.act-all    {background:var(--text);color:#fff;border-color:var(--text);}
.f-btn.act-history{background:var(--brown);color:#fff;border-color:var(--brown);}
.f-btn.act-nature {background:var(--green);color:#fff;border-color:var(--green);}
.f-btn.act-culture{background:var(--gem);color:#fff;border-color:var(--gem);}
.f-btn.act{background:var(--gem-soft);color:var(--gem);border-color:var(--gem);}

/* ── 메인 레이아웃 ── */
.main{display:grid;grid-template-columns:1fr 360px;flex:1;min-height:0;overflow:hidden;}

/* ── 지도 ── */
#naver-map{width:100%;height:100%;min-height:400px;}

/* ── 마커 카운터 ── */
.map-counter{
  position:absolute;top:14px;left:14px;z-index:50;
  background:rgba(255,255,255,.97);border:1.5px solid var(--border);
  border-radius:12px;padding:8px 16px;box-shadow:0 2px 12px rgba(0,0,0,.1);
}
.mc-num{font-size:22px;font-weight:900;color:var(--gem);line-height:1;}
.mc-lbl{font-size:11px;color:var(--muted);margin-top:1px;}

/* ── 팝업 카드 ── */
.popup{
  position:absolute;bottom:18px;left:18px;
  width:340px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:20px;
  padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.13);
  display:none;z-index:100;
}
.popup.show{display:block;}
.popup-close{
  position:absolute;top:14px;right:16px;
  background:var(--bg);border:1px solid var(--border);
  width:28px;height:28px;border-radius:50%;
  font-size:14px;cursor:pointer;color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.popup-close:hover{color:var(--text);}

.pp-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.pp-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;}

.pp-name{font-size:22px;font-weight:900;letter-spacing:-.5px;margin-bottom:7px;line-height:1.2;}
.pp-desc{font-size:13px;line-height:1.7;color:#444;margin-bottom:12px;}

.pp-meta{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;background:var(--bg);border-radius:10px;padding:12px;}
.pp-meta-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;}
.pp-meta-icon{width:16px;flex-shrink:0;color:var(--muted);margin-top:1px;}
.pp-meta-val{color:var(--muted);flex:1;line-height:1.5;}
.pp-meta-link{color:var(--gem);text-decoration:none;font-size:11px;font-weight:600;}
.pp-meta-link:hover{text-decoration:underline;}

.pp-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.pp-tag{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--bg);color:var(--muted);border:1px solid var(--border);}

.pp-btns{display:flex;gap:9px;}
.pp-btn-video{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px;background:#ff0000;color:#fff;border:none;
  border-radius:11px;font-size:13px;font-weight:700;
  cursor:pointer;text-decoration:none;transition:background .15s;
}
.pp-btn-video:hover{opacity:.88;}
.pp-btn-detail{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:11px;background:var(--gem-soft);color:var(--gem);
  border:1.5px solid rgba(30,58,138,.25);border-radius:11px;
  font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;
  transition:all .15s;
}
.pp-btn-detail:hover{background:var(--gem);color:#fff;}
.pp-no-video{
  width:100%;padding:10px;text-align:center;
  font-size:12px;color:var(--muted);
  background:var(--bg);border:1.5px solid var(--border);border-radius:11px;
}

/* ── 오른쪽 패널 ── */
.side{background:var(--surface);border-left:1.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;height:100%;}
.side-head{
  padding:14px 18px;border-bottom:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.side-head h3{font-size:16px;font-weight:900;}
.side-count{
  background:var(--gem-soft);color:var(--gem);
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;
}
.side-list{overflow-y:auto;flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;}

/* ── 사이드 카드 ── */
.scard{
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:12px;padding:12px 14px;
  cursor:pointer;transition:all .15s;display:flex;gap:10px;
}
.scard:hover,.scard.sel{border-color:var(--gem);background:var(--gem-soft);}
.sc-icon{font-size:26px;flex-shrink:0;padding-top:2px;}
.sc-body{flex:1;min-width:0;}
.sc-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.sc-name{font-size:14px;font-weight:900;}
.sc-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;}
.sc-meta{font-size:11px;color:var(--muted);margin-bottom:4px;}
.sc-desc{font-size:11px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-video{width:7px;height:7px;border-radius:50%;background:#ff0000;flex-shrink:0;margin-top:6px;}

.empty-list{text-align:center;padding:48px 20px;color:var(--muted);font-size:14px;line-height:1.8;}
</style>
</head>
<body>

<header>
  <div class="logo">GemKorea<small>HISTORY MAP</small></div>
  <div class="search-wrap">
    <span style="color:var(--muted);font-size:15px;">🔍</span>
    <input id="search-input" type="text" placeholder="장소명, 시대, 태그 검색...">
  </div>
  <a href="admin.html" class="admin-link">⚙️ 관리자</a>
</header>

<div class="filter-area">
  <!-- 상위 카테고리 -->
  <div class="filter-row">
    <span class="filter-label">카테고리</span>
    <button class="f-btn act-all"      data-main="all"       onclick="setMain(this)">전체</button>
    <button class="f-btn"              data-main="역사"       onclick="setMain(this)">🏛️ 역사</button>
    <button class="f-btn"              data-main="자연"       onclick="setMain(this)">🌿 자연</button>
    <button class="f-btn"              data-main="문화/체험"  onclick="setMain(this)">🎭 문화·체험</button>
  </div>
  <!-- 세부 카테고리 -->
  <div class="filter-row">
    <span class="filter-label">세부</span>
    <button class="f-btn act" data-sub="all"             onclick="setSub(this)">전체</button>
    <button class="f-btn" data-sub="궁궐/왕실"           onclick="setSub(this)">👑 궁궐·왕실</button>
    <button class="f-btn" data-sub="고인돌/선사유적"      onclick="setSub(this)">🪨 고인돌·선사</button>
    <button class="f-btn" data-sub="성곽/산성"           onclick="setSub(this)">🏰 성곽·산성</button>
    <button class="f-btn" data-sub="사찰/불교유산"        onclick="setSub(this)">🛕 사찰·불교</button>
    <button class="f-btn" data-sub="비석/기념유산"        onclick="setSub(this)">🪧 비석·기념</button>
    <button class="f-btn" data-sub="독립운동/근현대"      onclick="setSub(this)">🏴 독립운동</button>
    <button class="f-btn" data-sub="고택/서원/향교"       onclick="setSub(this)">📚 서원·향교</button>
    <button class="f-btn" data-sub="산"                  onclick="setSub(this)">⛰️ 산</button>
    <button class="f-btn" data-sub="바다/해변"            onclick="setSub(this)">🌊 바다</button>
    <button class="f-btn" data-sub="박물관"               onclick="setSub(this)">🏛️ 박물관</button>
  </div>
  <!-- 시대 -->
  <div class="filter-row">
    <span class="filter-label">시대</span>
    <button class="f-btn act" data-era="all"    onclick="setEra(this)">전체</button>
    <button class="f-btn" data-era="선사"        onclick="setEra(this)">🪨 선사</button>
    <button class="f-btn" data-era="삼국"        onclick="setEra(this)">⚔️ 삼국</button>
    <button class="f-btn" data-era="고려"        onclick="setEra(this)">📜 고려</button>
    <button class="f-btn" data-era="조선"        onclick="setEra(this)">👑 조선</button>
    <button class="f-btn" data-era="근현대"      onclick="setEra(this)">📰 근현대</button>
  </div>
  <!-- 지역 -->
  <div class="filter-row">
    <span class="filter-label">지역</span>
    <button class="f-btn act" data-region="all" onclick="setRegion(this)">전체</button>
    <button class="f-btn" data-region="서울" onclick="setRegion(this)">🗺️ 서울</button>
    <button class="f-btn" data-region="경기" onclick="setRegion(this)">🗺️ 경기</button>
    <button class="f-btn" data-region="인천" onclick="setRegion(this)">🗺️ 인천</button>
    <button class="f-btn" data-region="충청" onclick="setRegion(this)">🗺️ 충청</button>
    <button class="f-btn" data-region="경상" onclick="setRegion(this)">🗺️ 경상</button>
    <button class="f-btn" data-region="전라" onclick="setRegion(this)">🗺️ 전라</button>
    <button class="f-btn" data-region="강원" onclick="setRegion(this)">🗺️ 강원</button>
    <button class="f-btn" data-region="제주" onclick="setRegion(this)">🗺️ 제주</button>
  </div>
</div>

<div class="main">
  <div style="position:relative;height:100%;">
    <div id="naver-map" style="width:100%;height:100%;"></div>

    <div class="map-counter">
      <div class="mc-num" id="visible-count">0</div>
      <div class="mc-lbl">곳 표시 중</div>
    </div>

    <!-- 팝업 카드 -->
    <div class="popup" id="popup">
      <button class="popup-close" onclick="closePopup()">✕</button>
      <div class="pp-badges" id="pp-badges"></div>
      <div class="pp-name" id="pp-name"></div>
      <div class="pp-desc" id="pp-desc"></div>
      <div class="pp-meta">
        <div class="pp-meta-row"><span class="pp-meta-icon">🕰️</span><span class="pp-meta-val" id="pm-era"></span></div>
        <div class="pp-meta-row"><span class="pp-meta-icon">📍</span><span class="pp-meta-val" id="pm-addr"></span></div>
        <div class="pp-meta-row" id="pm-src-row">
          <span class="pp-meta-icon">🔗</span><span class="pp-meta-val" id="pm-src"></span>
        </div>
      </div>
      <div class="pp-tags" id="pp-tags"></div>
      <div class="pp-btns" id="pp-btns"></div>
    </div>
  </div>

  <!-- 오른쪽 패널 -->
  <div class="side">
    <div class="side-head">
      <h3>역사 명소</h3>
      <span class="side-count" id="side-count">0곳</span>
    </div>
    <div class="side-list" id="side-list"></div>
  </div>
</div>

<script>
const SUB_COLOR={
  '궁궐/왕실':'#C8860A','고인돌/선사유적':'#6B5B95','성곽/산성':'#8B6914',
  '사찰/불교유산':'#D4380D','비석/기념유산':'#495057','독립운동/근현대':'#1B4332',
  '고택/서원/향교':'#2D6A4F','산':'#2D6A4F','바다/해변':'#0077B6',
  '강/호수':'#0096C7','숲/공원':'#52B788','자연명승':'#40916C',
  '전통시장':'#E76F51','체험마을':'#F4A261','박물관':'#1e3a8a',
  '축제':'#b8860b','전통문화 체험':'#E76F51'
};
const SUB_ICON={
  '궁궐/왕실':'👑','고인돌/선사유적':'🪨','성곽/산성':'🏰',
  '사찰/불교유산':'🛕','비석/기념유산':'🪧','독립운동/근현대':'🏴',
  '고택/서원/향교':'📚','산':'⛰️','바다/해변':'🌊','강/호수':'💧',
  '숲/공원':'🌲','자연명승':'🌄','전통시장':'🏪','체험마을':'🏘️',
  '박물관':'🏛️','축제':'🎉','전통문화 체험':'🎨'
};
const MAIN_COLOR={'역사':'#7c5c3a','자연':'#4a8c5c','문화/체험':'#1e3a8a'};
const REGION_MAP={
  '서울특별시':'서울','경기도':'경기','인천광역시':'인천',
  '충청북도':'충청','충청남도':'충청','대전광역시':'충청','세종특별자치시':'충청',
  '경상북도':'경상','경상남도':'경상','부산광역시':'경상','대구광역시':'경상','울산광역시':'경상',
  '전라북도':'전라','전라남도':'전라','광주광역시':'전라',
  '강원도':'강원','강원특별자치도':'강원','제주특별자치도':'제주'
};
const ERA_MAP={
  '선사':'선사',
  '삼국':'삼국','통일신라':'삼국',
  '고려':'고려',
  '조선 전기':'조선','조선 후기':'조선',
  '근대':'근현대','현대':'근현대'
};

let places=[],map,naverMarkers=[];
let fMain='all',fSub='all',fEra='all',fRegion='all',fSearch='';
let selectedId=null;
let regionPolygon=null;

/* 지역 필터 키 → GeoJSON 파일명 매핑 */
const REGION_FILES={
  '서울':'seoul','경기':'gyeonggi','인천':'incheon',
  '충청':'chungcheong','경상':'gyeongsang','전라':'jeolla',
  '강원':'gangwon','제주':'jeju'
};

/* 지역별 색상 (상위 카테고리 색상과 구분) */
const REGION_COLORS={
  '서울':  {fill:'#1e3a8a',stroke:'#1e3a8a'},
  '경기':  {fill:'#2d6a4f',stroke:'#2d6a4f'},
  '인천':  {fill:'#0077b6',stroke:'#0077b6'},
  '충청':  {fill:'#7c5c3a',stroke:'#7c5c3a'},
  '경상':  {fill:'#6b5b95',stroke:'#6b5b95'},
  '전라':  {fill:'#d4380d',stroke:'#d4380d'},
  '강원':  {fill:'#2d6a4f',stroke:'#2d6a4f'},
  '제주':  {fill:'#0096c7',stroke:'#0096c7'}
};

/* 네이버 지도 준비 완료 후 실행되는 전역 콜백 */
function naverMapsReady(){
  try{
    map=new naver.maps.Map('naver-map',{
      center:new naver.maps.LatLng(36.2,127.9),zoom:7,
      mapTypeControl:false,scaleControl:false,mapDataControl:false
    });
    render(); // 지도 생성 후 마커 렌더
  }catch(e){
    console.error('네이버 지도 초기화 실패:',e);
    showMapError('지도 초기화 오류: '+e.message);
  }
}

function showMapError(msg){
  document.getElementById('naver-map').innerHTML=
    '<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:#8a8278;font-size:14px;padding:20px;text-align:center;">'
    +'<div style="font-size:48px;">🗺️</div>'
    +'<div style="font-weight:700;">네이버 지도 로딩 실패</div>'
    +'<div style="font-size:12px;line-height:1.8;">'+msg+'<br>네이버 클라우드 콘솔 → Maps → 서비스 URL 확인</div>'
    +'</div>';
}

async function init(){
  // 데이터 로드
  try{
    const r=await fetch('data/heritage_all.json');
    if(r.ok) places=await r.json();
    else throw new Error('HTTP '+r.status);
  }catch(e){
    console.warn('데이터 로드 실패:', e.message, '→ http://localhost:4000 또는 GitHub Pages에서 접속');
    places=[];
  }

  // 네이버 지도: 이미 로드됐으면 바로 초기화, 아니면 콜백 대기
  if(typeof naver!=='undefined' && naver.maps && naver.maps.Map){
    naverMapsReady();
  } else {
    // 아직 로드 중 — 최대 5초 대기
    let waited=0;
    const check=setInterval(()=>{
      waited+=200;
      if(typeof naver!=='undefined' && naver.maps && naver.maps.Map){
        clearInterval(check);
        naverMapsReady();
      } else if(waited>=5000){
        clearInterval(check);
        showMapError('네이버 지도 스크립트 로드 실패<br>인터넷 연결 또는 API 키를 확인해 주세요');
      }
    },200);
  }

  // 검색 이벤트 (지도와 독립)
  document.getElementById('search-input').addEventListener('input',e=>{fSearch=e.target.value.trim();render();});
  render(); // 사이드 패널은 지도 없이도 표시
}

function setMain(el){
  fMain=el.dataset.main;fSub='all';
  document.querySelectorAll('[data-main]').forEach(b=>b.className='f-btn');
  const cls=fMain==='all'?'act-all':fMain==='역사'?'act-history':fMain==='자연'?'act-nature':'act-culture';
  el.classList.add(cls);
  document.querySelectorAll('[data-sub]').forEach(b=>b.classList.remove('act'));
  document.querySelector('[data-sub="all"]').classList.add('act');
  render();
}
function setSub(el){fSub=el.dataset.sub;document.querySelectorAll('[data-sub]').forEach(b=>b.classList.remove('act'));el.classList.add('act');render();}
function setEra(el){fEra=el.dataset.era;document.querySelectorAll('[data-era]').forEach(b=>b.classList.remove('act'));el.classList.add('act');render();}
function setRegion(el){
  fRegion=el.dataset.region;
  document.querySelectorAll('[data-region]').forEach(b=>b.classList.remove('act'));
  el.classList.add('act');
  showRegionBoundary(fRegion);
  render();
}

/* 지역 경계 초기화 */
function clearRegionPolygon(){
  if(regionPolygon){
    if(Array.isArray(regionPolygon)){
      regionPolygon.forEach(p=>p.setMap(null));
    } else {
      regionPolygon.setMap(null);
    }
    regionPolygon=null;
  }
}

/* 지역 경계 표시 */
async function showRegionBoundary(regionKey){
  clearRegionPolygon();
  if(regionKey==='all'||!REGION_FILES[regionKey]||typeof naver==='undefined') return;

  const col = REGION_COLORS[regionKey]||{fill:'#1e3a8a',stroke:'#1e3a8a'};

  try{
    const res = await fetch('data/geojson/'+REGION_FILES[regionKey]+'.geojson');
    if(!res.ok) throw new Error('GeoJSON 로드 실패');
    const geojson = await res.json();

    const geomType = geojson.geometry.type;
    const coordSets = geomType==='MultiPolygon'
      ? geojson.geometry.coordinates.map(p=>p[0])
      : [geojson.geometry.coordinates[0]];

    const polygons = coordSets.map(coords=>{
      const paths = coords.map(c=>new naver.maps.LatLng(c[1],c[0]));
      return new naver.maps.Polygon({
        map,
        paths,
        strokeColor: col.stroke,
        strokeOpacity: 0.75,
        strokeWeight: 2.5,
        strokeStyle: 'solid',
        fillColor: col.fill,
        fillOpacity: 0.10
      });
    });

    regionPolygon = polygons.length===1 ? polygons[0] : polygons;

    /* 선택 지역으로 지도 이동 */
    const bounds = new naver.maps.LatLngBounds();
    coordSets.flat().forEach(c=>bounds.extend(new naver.maps.LatLng(c[1],c[0])));
    map.fitBounds(bounds, {top:60,right:40,bottom:60,left:40});

  }catch(e){
    console.warn('지역 경계 표시 실패:', regionKey, e.message);
  }
}

function getFiltered(){
  return places.filter(p=>{
    if(fMain!=='all'&&p.category_main!==fMain)return false;
    if(fSub!=='all'&&p.category_sub!==fSub)return false;
    if(fEra!=='all'&&(ERA_MAP[p.period_category]||p.period_category)!==fEra)return false;
    if(fRegion!=='all'&&(REGION_MAP[p.region]||p.region)!==fRegion)return false;
    if(fSearch){const q=fSearch.toLowerCase();const h=[p.name,p.region,p.short_description,...(p.tags||[]),p.period_category].join(' ').toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
}

function render(){
  const f=getFiltered();
  document.getElementById('visible-count').textContent=f.length;
  document.getElementById('side-count').textContent=f.length+'곳';
  renderMarkers(f);renderCards(f);
}

function renderMarkers(f){
  naverMarkers.forEach(m=>m.setMap(null));naverMarkers=[];
  if(!map||typeof naver==='undefined')return;
  f.forEach(p=>{
    if(!p.lat||!p.lng)return;
    const col=SUB_COLOR[p.category_sub]||'#888';
    const ico=SUB_ICON[p.category_sub]||'📍';
    const dot=p.content_link?.has_video?'<span style="width:6px;height:6px;background:#ff0000;border-radius:50%;display:inline-block;margin-left:3px;vertical-align:middle;"></span>':'';
    const mk=new naver.maps.Marker({
      position:new naver.maps.LatLng(p.lat,p.lng),map,title:p.name,
      icon:{
        content:`<div style="background:${col};color:#fff;padding:5px 11px;border-radius:18px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.22);display:flex;align-items:center;gap:3px;">${ico} ${p.name}${dot}</div>`,
        anchor:new naver.maps.Point(40,15)
      }
    });
    naver.maps.Event.addListener(mk,'click',()=>showPopup(p));
    naverMarkers.push(mk);
  });
}

function renderCards(f){
  const list=document.getElementById('side-list');
  if(!f.length){list.innerHTML='<div class="empty-list">🗺️ 해당하는 장소가 없어요</div>';return;}
  list.innerHTML=f.map(p=>{
    const col=SUB_COLOR[p.category_sub]||'#888';
    const ico=SUB_ICON[p.category_sub]||'📍';
    return `<div class="scard${p.place_id===selectedId?' sel':''}" id="sc-${p.place_id}" onclick="focusCard('${p.place_id}')">
      <div class="sc-icon">${ico}</div>
      <div class="sc-body">
        <div class="sc-top">
          <div class="sc-name">${p.name}</div>
          <span class="sc-badge" style="background:${col}20;color:${col};">${p.category_sub||''}</span>
          ${p.content_link?.has_video?'<div class="sc-video" title="숏츠 있음"></div>':''}
        </div>
        <div class="sc-meta">📍 ${REGION_MAP[p.region]||p.region} · ${ERA_MAP[p.period_category]||p.period_category}</div>
        <div class="sc-desc">${p.short_description||''}</div>
      </div>
    </div>`;
  }).join('');
}

function showPopup(p){
  selectedId=p.place_id;
  const col=SUB_COLOR[p.category_sub]||'#888';
  const mainCol=MAIN_COLOR[p.category_main]||'#888';
  const eraShort=ERA_MAP[p.period_category]||p.period_category;

  document.getElementById('pp-badges').innerHTML=`
    <span class="pp-badge" style="background:${mainCol}18;color:${mainCol};">${p.category_main}</span>
    <span class="pp-badge" style="background:${col}18;color:${col};">${p.category_sub||''}</span>
    <span class="pp-badge" style="background:var(--bg);color:var(--muted);">🕰️ ${eraShort}</span>`;

  document.getElementById('pp-name').textContent=p.name;
  document.getElementById('pp-desc').textContent=p.short_description||'';
  document.getElementById('pm-era').textContent=p.period||p.period_category||'—';
  document.getElementById('pm-addr').textContent=p.address||(REGION_MAP[p.region]||p.region)+' 소재';

  const srcEl=document.getElementById('pm-src');
  const srcRow=document.getElementById('pm-src-row');
  if(p.source_urls&&p.source_urls.length){
    srcEl.innerHTML=p.source_urls.slice(0,2).map((u,i)=>`<a class="pp-meta-link" href="${u}" target="_blank">출처${p.source_urls.length>1?i+1:''}</a>`).join(' · ');
    srcRow.style.display='flex';
  }else{srcRow.style.display='none';}

  document.getElementById('pp-tags').innerHTML=(p.tags||[]).map(t=>`<span class="pp-tag">#${t}</span>`).join('');

  const cl=p.content_link;
  const videoUrl=cl?.youtube_url||cl?.instagram_url||cl?.tiktok_url||'';
  const videoBg=cl?.youtube_url?'#ff0000':cl?.instagram_url?'#E1306C':'#010101';
  const videoLabel=cl?.youtube_url?'▶ 유튜브 숏츠':cl?.instagram_url?'▶ 인스타 릴스':'▶ 틱톡';

  document.getElementById('pp-btns').innerHTML=videoUrl
    ?`<a class="pp-btn-video" href="${videoUrl}" target="_blank" style="background:${videoBg};">${videoLabel}</a>
       <button class="pp-btn-detail" onclick="alert('상세 페이지 준비 중입니다')">자세히 보기</button>`
    :`<div class="pp-no-video">📹 콘텐츠 준비 중</div>
       <button class="pp-btn-detail" onclick="alert('상세 페이지 준비 중입니다')" style="display:flex;align-items:center;justify-content:center;gap:5px;padding:11px;background:var(--gem-soft);color:var(--gem);border:1.5px solid rgba(30,58,138,.25);border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;">자세히 보기</button>`;

  document.getElementById('popup').classList.add('show');
  if(map&&p.lat&&p.lng)map.panTo(new naver.maps.LatLng(p.lat,p.lng));

  document.querySelectorAll('.scard').forEach(c=>c.classList.remove('sel'));
  const el=document.getElementById('sc-'+p.place_id);
  if(el){el.classList.add('sel');el.scrollIntoView({behavior:'smooth',block:'nearest'});}
}

function focusCard(id){const p=places.find(x=>x.place_id===id);if(p)showPopup(p);}
function closePopup(){document.getElementById('popup').classList.remove('show');selectedId=null;document.querySelectorAll('.scard').forEach(c=>c.classList.remove('sel'));}

init();
</script>
</body>
</html>
