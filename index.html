<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GemKorea — 대한민국 여행 지도</title>
<script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=y60jsyh564"></script>
<style>
  :root {
    --bg: #f9f7f4;
    --surface: #ffffff;
    --border: #e8e4dc;
    --text: #1a1612;
    --muted: #8a8278;
    --travel: #e8813a;
    --history: #7c5c3a;
    --nature: #4a8c5c;
    --gem: #8b5cf6;
    --gem-soft: #ede9fe;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, 'Malgun Gothic', sans-serif; background:var(--bg); color:var(--text); }

  header {
    background:var(--surface); border-bottom:1px solid var(--border);
    padding:0 32px; position:sticky; top:0; z-index:100;
    display:flex; align-items:center; height:60px; gap:24px;
  }
  .logo { font-size:20px; font-weight:900; background:linear-gradient(135deg,#e8813a,#8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; flex-shrink:0; }
  .logo span { font-size:10px; color:var(--muted); -webkit-text-fill-color:var(--muted); display:block; letter-spacing:1px; }

  nav { display:flex; gap:4px; }
  .nav-btn { padding:5px 14px; border-radius:20px; border:1px solid transparent; background:none; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); transition:all 0.15s; }
  .nav-btn:hover { background:var(--bg); color:var(--text); }
  .nav-btn.active { background:var(--text); color:#fff; }

  .search-box { margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:24px; padding:7px 14px; width:200px; }
  .search-box input { border:none; background:none; outline:none; font-size:13px; width:100%; color:var(--text); }

  .main { display:grid; grid-template-columns:1fr 360px; height:calc(100vh - 60px); }

  /* 지도 */
  #naver-map { width:100%; height:100%; }

  /* 오른쪽 패널 */
  .side-panel { background:var(--surface); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }

  .panel-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .panel-header h3 { font-size:15px; font-weight:900; }
  .count-badge { background:var(--gem-soft); color:var(--gem); font-size:12px; font-weight:700; padding:3px 10px; border-radius:20px; }

  .filter-bar { padding:12px 16px; display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid var(--border); flex-shrink:0; }
  .filter-btn { padding:5px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:600; cursor:pointer; color:var(--muted); transition:all 0.15s; }
  .filter-btn:hover { border-color:var(--gem); color:var(--gem); }
  .filter-btn.active { background:var(--gem); color:#fff; border-color:var(--gem); }
  .filter-btn.travel.active { background:var(--travel); border-color:var(--travel); }
  .filter-btn.history.active { background:var(--history); border-color:var(--history); }
  .filter-btn.nature.active { background:var(--nature); border-color:var(--nature); }

  .cards-list { overflow-y:auto; flex:1; padding:12px; display:flex; flex-direction:column; gap:10px; }

  .card { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:12px 14px; cursor:pointer; transition:all 0.15s; display:flex; gap:12px; align-items:flex-start; }
  .card:hover, .card.active { border-color:var(--gem); background:#faf8ff; }
  .card-emoji { font-size:28px; flex-shrink:0; }
  .card-body { flex:1; min-width:0; }
  .card-top { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .card-title { font-size:14px; font-weight:900; }
  .card-region { font-size:11px; color:var(--muted); }
  .card-desc { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-tags { display:flex; gap:3px; flex-wrap:wrap; }
  .card-tag { font-size:10px; padding:1px 6px; border-radius:6px; background:var(--surface); color:var(--muted); border:1px solid var(--border); }
  .badge { font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px; }
  .badge.travel { background:rgba(232,129,58,0.15); color:var(--travel); }
  .badge.history { background:rgba(124,92,58,0.15); color:var(--history); }
  .badge.nature { background:rgba(74,140,92,0.15); color:var(--nature); }

  /* 지도 정보창 */
  .map-info { position:absolute; bottom:32px; left:32px; background:var(--surface); border-radius:16px; padding:16px 20px; box-shadow:0 8px 32px rgba(0,0,0,0.15); max-width:300px; z-index:10; display:none; }
  .map-info.show { display:block; }
  .map-info-title { font-size:17px; font-weight:900; margin-bottom:4px; }
  .map-info-region { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .map-info-desc { font-size:13px; line-height:1.6; color:var(--muted); margin-bottom:10px; }
  .map-info-tags { display:flex; gap:4px; flex-wrap:wrap; }
  .map-info-close { position:absolute; top:10px; right:12px; background:none; border:none; font-size:18px; cursor:pointer; color:var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">GemKorea <span>TRAVEL GUIDE</span></div>
  <nav>
    <button class="nav-btn active" onclick="filterType('all',this)">전체</button>
    <button class="nav-btn" onclick="filterType('travel',this)">🧭 여행</button>
    <button class="nav-btn" onclick="filterType('history',this)">🏛️ 역사</button>
    <button class="nav-btn" onclick="filterType('nature',this)">🌿 자연</button>
  </nav>
  <div class="search-box">
    <span>🔍</span>
    <input type="text" placeholder="여행지 검색..." oninput="searchPlaces(this.value)">
  </div>
</header>

<div class="main">
  <div style="position:relative;">
    <div id="naver-map"></div>
    <!-- 지도 클릭 정보창 -->
    <div class="map-info" id="map-info">
      <button class="map-info-close" onclick="closeMapInfo()">✕</button>
      <div class="map-info-title" id="info-title"></div>
      <div class="map-info-region" id="info-region"></div>
      <div class="map-info-desc" id="info-desc"></div>
      <div class="map-info-tags" id="info-tags"></div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-header">
      <h3>✨ 추천 여행지</h3>
      <span class="count-badge" id="count-badge">0곳</span>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterType('all',this)">전체</button>
      <button class="filter-btn travel" onclick="filterType('travel',this)">🧭 여행</button>
      <button class="filter-btn history" onclick="filterType('history',this)">🏛️ 역사</button>
      <button class="filter-btn nature" onclick="filterType('nature',this)">🌿 자연</button>
    </div>
    <div class="cards-list" id="cards-list"></div>
  </div>
</div>

  { id:40, name:'진도 운림산방',  region:'전라', cat:'history', emoji:'🎨', lat:34.4281, lng:126.2826, desc:'조선 최고의 화가 소치 허련의 화실. 연못과 배롱나무가 아름다운 정원', tags:['화가','정원','전통'] },

  // 경상 추가
  { id:41, name:'양동마을',       region:'경상', cat:'history', emoji:'🏡', lat:35.9156, lng:129.2225, desc:'500년 된 경주 손씨·여강 이씨 씨족마을. 하회마을과 함께 유네스코 세계유산', tags:['한옥','유네스코','씨족마을'] },
  { id:42, name:'통영 한산도',    region:'경상', cat:'history', emoji:'⚓', lat:34.8219, lng:128.4819, desc:'이순신 장군이 왜군을 물리친 한산대첩의 현장. 제승당이 있는 섬', tags:['이순신','임진왜란','역사'] },
  { id:43, name:'밀양 얼음골',    region:'경상', cat:'nature',  emoji:'❄️', lat:35.5392, lng:128.9726, desc:'여름에 얼음이 어는 신비의 계곡. 천연기념물', tags:['얼음','신비','여름'] },
  { id:44, name:'군위 사유원',    region:'경상', cat:'nature',  emoji:'🌿', lat:36.2312, lng:128.6923, desc:'자연 속 예술 공간. 수목원·조각·건축이 하나로 어우러진 힐링 명소', tags:['수목원','예술','힐링'] },
  { id:45, name:'고성 공룡발자국', region:'경상', cat:'history', emoji:'🦕', lat:34.9778, lng:128.3219, desc:'세계 최대 공룡발자국 화석 산지. 1억 년 전 공룡의 흔적', tags:['공룡','화석','신비'] },

  // 제주 추가
  { id:46, name:'우도',           region:'제주', cat:'travel',  emoji:'🏝️', lat:33.5016, lng:126.9516, desc:'소가 누운 모습을 닮은 제주 부속섬. 땅콩아이스크림과 에메랄드 바다', tags:['섬','바다','자전거'] },
  { id:47, name:'산방산',         region:'제주', cat:'nature',  emoji:'🌋', lat:33.2403, lng:126.3133, desc:'바다 위로 솟은 종 모양의 화산. 용머리해안과 함께 절경', tags:['화산','바다','절경'] },
  { id:48, name:'비자림',         region:'제주', cat:'nature',  emoji:'🌲', lat:33.4916, lng:126.8094, desc:'500~800년 된 비자나무 2800그루. 신비로운 숲 터널', tags:['숲','비자나무','산책'] },
];

let currentType = 'all';
let searchQuery = '';
let map, markers = [], activeCard = null;

const catColor = { travel:'#e8813a', history:'#7c5c3a', nature:'#4a8c5c' };
const catLabel = { travel:'여행', history:'역사', nature:'자연' };

// 네이버 지도 초기화
window.onload = function() {
  try {
    if (typeof naver !== 'undefined' && naver.maps) {
      map = new naver.maps.Map('naver-map', {
        center: new naver.maps.LatLng(36.3, 127.8),
        zoom: 7,
        mapTypeId: naver.maps.MapTypeId.NORMAL
      });
    }
  } catch(e) {
    console.log('지도 로딩 실패:', e);
  }
  renderAll();
};

function renderAll() {
  clearMarkers();
  const filtered = getFiltered();
  document.getElementById('count-badge').textContent = filtered.length + '곳';
  renderMarkers(filtered);
  renderCards(filtered);
}

function getFiltered() {
  return PLACES.filter(p => {
    const t = currentType === 'all' || p.cat === currentType;
    const s = !searchQuery || p.name.includes(searchQuery) || p.desc.includes(searchQuery);
    return t && s;
  });
}

function renderMarkers(places) {
  places.forEach(p => {
    const marker = new naver.maps.Marker({
      position: new naver.maps.LatLng(p.lat, p.lng),
      map: map,
      title: p.name,
      icon: {
        content: `<div style="background:${catColor[p.cat]};color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,0.2)">${p.emoji} ${p.name}</div>`,
        anchor: new naver.maps.Point(40, 16)
      }
    });
    naver.maps.Event.addListener(marker, 'click', () => showMapInfo(p));
    markers.push(marker);
  });
}

function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
}

function showMapInfo(p) {
  document.getElementById('info-title').textContent = p.emoji + ' ' + p.name;
  document.getElementById('info-region').textContent = '📍 ' + p.region + ' · ' + catLabel[p.cat];
  document.getElementById('info-desc').textContent = p.desc;
  document.getElementById('info-tags').innerHTML = p.tags.map(t => `<span class="card-tag">#${t}</span>`).join('');
  document.getElementById('map-info').classList.add('show');
  if (map && naver && naver.maps) {
    map.panTo(new naver.maps.LatLng(p.lat, p.lng));
  }
  highlightCard(p.id);
}

function closeMapInfo() {
  document.getElementById('map-info').classList.remove('show');
}

function highlightCard(id) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  const el = document.getElementById('card-' + id);
  if (el) { el.classList.add('active'); el.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}

function renderCards(places) {
  const list = document.getElementById('cards-list');
  if (!places.length) { list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">🗺️ 해당하는 여행지가 없어요</div>'; return; }
  list.innerHTML = places.map(p => `
    <div class="card" id="card-${p.id}" onclick="focusPlace(${p.id})">
      <div class="card-emoji">${p.emoji}</div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-title">${p.name}</div>
          <span class="badge ${p.cat}">${catLabel[p.cat]}</span>
        </div>
        <div class="card-region">📍 ${p.region}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-tags">${p.tags.map(t=>`<span class="card-tag">#${t}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

function focusPlace(id) {
  const p = PLACES.find(x => x.id === id);
  if (p) showMapInfo(p);
}

function filterType(type, el) {
  currentType = type;
  document.querySelectorAll('.nav-btn, .filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.nav-btn, .filter-btn').forEach(b => {
    if ((type==='all' && b.textContent.trim()==='전체') || b.classList.contains(type)) b.classList.add('active');
  });
  el.classList.add('active');
  renderAll();
}

function searchPlaces(q) {
  searchQuery = q.trim();
  renderAll();
}
</script>
