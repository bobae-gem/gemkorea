<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GemKorea 업로드 관리</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="nav">
  <a href="../admin.html" style="text-decoration:none;"><div class="nav-logo">GemKorea <small>ADMIN</small></div></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">🚀 업로드 관리</span>
  <div class="nav-spacer"></div>
  <span class="nav-time" id="now-time"></span>
  <a href="../admin.html" class="nav-link">🏠 홈</a>
</div>
<div class="page-wrap">
  <div class="grid g4" style="margin-bottom:14px;">
    <div class="card"><div class="kpi" id="up-total" style="color:var(--green)">0</div><div class="kpi-label">업로드 완료</div></div>
    <div class="card"><div class="kpi" id="up-scheduled" style="color:var(--accent)">0</div><div class="kpi-label">예약됨</div></div>
    <div class="card"><div class="kpi" id="up-youtube" style="color:var(--red)">0</div><div class="kpi-label">유튜브</div></div>
    <div class="card"><div class="kpi" id="up-insta" style="color:var(--accent2)">0</div><div class="kpi-label">인스타그램</div></div>
  </div>

  <div class="card" style="margin-bottom:14px;">
    <div class="card-head"><span class="card-title">업로드 내역</span></div>
    <div id="up-list"><div class="empty">📤 업로드된 콘텐츠 없음<br><span style="font-size:11px;margin-top:6px;display:block;">SNS 승인 후 업로드하면 여기에 표시됩니다</span></div></div>
  </div>

  <div class="card">
    <div class="card-head"><span class="card-title">플랫폼별 업로드 권장 시간</span></div>
    <div class="row"><span style="font-weight:700;">📺 유튜브 쇼츠</span><span style="color:var(--muted);">오전 7시 · 오후 6시</span></div>
    <div class="row"><span style="font-weight:700;">📸 인스타그램 릴스</span><span style="color:var(--muted);">오전 11시 · 오후 8시</span></div>
    <div class="row"><span style="font-weight:700;">🎵 틱톡</span><span style="color:var(--muted);">오후 3시 · 오후 9시</span></div>
    <div class="row" style="border-bottom:none;"><span style="font-weight:700;">📱 샤오홍슈</span><span style="color:var(--muted);">오후 12시 · 오후 7시 (중국 시간)</span></div>
  </div>
</div>
<script>
function tick(){const n=new Date();document.getElementById('now-time').textContent=n.toLocaleDateString('ko-KR')+' '+n.toLocaleTimeString('ko-KR');}
setInterval(tick,1000);tick();
async function load(){
  try{
    const r=await fetch('../data/heritage_all.json');const data=await r.json();
    document.getElementById('up-total').textContent=data.filter(d=>d.status?.content_status==='uploaded').length;
    document.getElementById('up-scheduled').textContent=data.filter(d=>d.status?.content_status==='approved').length;
    document.getElementById('up-youtube').textContent=data.filter(d=>d.content_link?.youtube_url).length;
    document.getElementById('up-insta').textContent=data.filter(d=>d.content_link?.instagram_url).length;
  }catch(e){}
}
load();
</script>
</body>
</html>
