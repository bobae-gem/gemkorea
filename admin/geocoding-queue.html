<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GemKorea 좌표 변환 대기</title>
<link rel="stylesheet" href="shared.css">
<style>
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:10px 14px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);}
.tbl td{padding:10px 14px;font-size:12px;border-bottom:1px solid var(--border);}
.tbl tr:hover td{background:rgba(255,255,255,.02);}
input,select{padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;}
</style>
</head>
<body>
<div class="nav">
  <a href="../admin.html" style="text-decoration:none;"><div class="nav-logo">GemKorea <small>ADMIN</small></div></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">🗺️ 좌표 변환 대기</span>
  <div class="nav-spacer"></div>
  <span class="nav-time" id="now-time"></span>
  <a href="../admin.html" class="nav-link">🏠 홈</a>
</div>
<div class="page-wrap">
  <div class="card hl-yellow" style="margin-bottom:14px;">
    <div class="card-head">
      <span class="card-title">좌표 없음 — 주소 기반 변환 필요</span>
      <span class="by badge" id="geo-badge">0개</span>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:14px;">주소는 있지만 위도/경도 좌표가 없는 장소입니다. 네이버 지도 또는 카카오맵에서 좌표를 확인 후 입력해주세요.</p>
    <table class="tbl">
      <thead><tr><th>이름</th><th>지역</th><th>주소</th><th>카테고리</th><th>조치</th></tr></thead>
      <tbody id="geo-tbody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-head"><span class="card-title">좌표 직접 입력</span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
      <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Place ID</div><input id="inp-id" placeholder="GK-SE-BIS-0001" style="width:180px;"></div>
      <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px;">위도 (lat)</div><input id="inp-lat" placeholder="37.5752" style="width:120px;"></div>
      <div><div style="font-size:11px;color:var(--muted);margin-bottom:4px;">경도 (lng)</div><input id="inp-lng" placeholder="126.9769" style="width:120px;"></div>
      <button class="btn btn-green" onclick="alert('좌표 저장 기능은 서버 연동 후 사용 가능합니다.')">저장</button>
    </div>
  </div>
</div>
<script>
function tick(){const n=new Date();document.getElementById('now-time').textContent=n.toLocaleDateString('ko-KR')+' '+n.toLocaleTimeString('ko-KR');}
setInterval(tick,1000);tick();
async function load(){
  try{const r=await fetch('../data/heritage_all.json');const data=await r.json();
  const needs=data.filter(d=>d.needs_geocoding||!d.lat||d.lat==='');
  document.getElementById('geo-badge').textContent=needs.length+'개';
  document.getElementById('geo-tbody').innerHTML=needs.length?needs.map(d=>`
    <tr>
      <td style="font-weight:700;">${d.name}</td>
      <td style="font-size:11px;">${d.region||''}</td>
      <td style="font-size:11px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${d.address||'주소없음'}</td>
      <td style="font-size:11px;">${d.category_sub||''}</td>
      <td><button class="btn btn-green" style="padding:4px 10px;font-size:10px;" onclick="document.getElementById('inp-id').value='${d.place_id}'">입력</button></td>
    </tr>`).join(''):`<tr><td colspan="5" style="text-align:center;color:var(--green);padding:20px;">✅ 좌표 변환 대기 없음</td></tr>`;
  }catch(e){document.getElementById('geo-badge').textContent='오류';}
}
load();
</script>
</body>
</html>
