<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GemKorea 마커 관리</title>
<link rel="stylesheet" href="shared.css">
<style>
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:10px 14px;text-align:left;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border);}
.tbl td{padding:10px 14px;font-size:12px;border-bottom:1px solid var(--border);}
.tbl tr:hover td{background:rgba(255,255,255,.02);}
.tag{display:inline-flex;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700;}
select,input{padding:6px 11px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;}
</style>
</head>
<body>
<div class="nav">
  <a href="../admin.html" style="text-decoration:none;"><div class="nav-logo">GemKorea <small>ADMIN</small></div></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">📍 마커 관리</span>
  <div class="nav-spacer"></div>
  <span class="nav-time" id="now-time"></span>
  <a href="../index.html" class="nav-link">🗺️ 지도</a>
  <a href="../admin.html" class="nav-link">🏠 홈</a>
</div>
<div class="page-wrap">
  <div class="card">
    <div class="card-head">
      <span class="card-title">전체 장소 목록</span>
      <span class="bb badge" id="total-badge">0개</span>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      <select id="filter-main">
        <option value="">전체 카테고리</option>
        <option>역사</option><option>자연</option><option>문화/체험</option>
      </select>
      <select id="filter-era">
        <option value="">전체 시대</option>
        <option>선사</option><option>삼국</option><option>통일신라</option><option>고려</option>
        <option>조선 전기</option><option>조선 후기</option><option>근대</option><option>현대</option>
      </select>
      <select id="filter-status">
        <option value="">전체 상태</option>
        <option value="waiting">대기</option>
        <option value="ready">준비완료</option>
        <option value="pending_approval">승인대기</option>
        <option value="published">게시중</option>
      </select>
      <input id="search" placeholder="장소명 검색..." style="flex:1;min-width:160px;">
    </div>
    <div style="overflow-x:auto;">
      <table class="tbl">
        <thead><tr>
          <th>place_id</th><th>이름</th><th>카테고리</th><th>시대</th>
          <th>지역</th><th>지도상태</th><th>콘텐츠</th><th>영상</th>
        </tr></thead>
        <tbody id="marker-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
function tick(){const n=new Date();document.getElementById('now-time').textContent=n.toLocaleDateString('ko-KR')+' '+n.toLocaleTimeString('ko-KR');}
setInterval(tick,1000);tick();

const MS={waiting:'대기',geocoding_needed:'좌표필요',ready:'준비완료',pending_approval:'승인대기',published:'게시중',video_linked:'영상연결'};
const MC={waiting:'#888',ready:'var(--accent2)',pending_approval:'var(--yellow)',published:'var(--green)',geocoding_needed:'var(--yellow)',video_linked:'#e8813a'};

let data=[];
async function load(){
  try{const r=await fetch('../data/heritage_all.json');data=await r.json();}catch(e){data=[];}
  render();
  ['filter-main','filter-era','filter-status','search'].forEach(id=>document.getElementById(id).addEventListener('input',render));
}

function render(){
  const fm=document.getElementById('filter-main').value;
  const fe=document.getElementById('filter-era').value;
  const fs=document.getElementById('filter-status').value;
  const sq=document.getElementById('search').value.toLowerCase();
  const f=data.filter(d=>{
    if(fm&&d.category_main!==fm)return false;
    if(fe&&d.period_category!==fe)return false;
    if(fs&&d.status?.map_status!==fs)return false;
    if(sq&&!d.name.toLowerCase().includes(sq))return false;
    return true;
  });
  document.getElementById('total-badge').textContent=f.length+'개';
  document.getElementById('marker-tbody').innerHTML=f.map(d=>`
    <tr>
      <td style="font-size:10px;color:var(--muted);">${d.place_id||''}</td>
      <td style="font-weight:700;">${d.name}</td>
      <td><span class="tag" style="background:rgba(124,92,252,.1);color:var(--accent);">${d.category_sub||d.category_main||''}</span></td>
      <td style="font-size:11px;color:var(--muted);">${d.period_category||''}</td>
      <td style="font-size:11px;">${d.region||''}</td>
      <td><span class="tag" style="background:${MC[d.status?.map_status]||'#888'}22;color:${MC[d.status?.map_status]||'#888'};">${MS[d.status?.map_status]||'—'}</span></td>
      <td style="font-size:11px;color:var(--muted);">${d.status?.content_status||'—'}</td>
      <td style="text-align:center;">${d.content_link?.has_video?'🔴':'—'}</td>
    </tr>`).join('');
}
load();
</script>
</body>
</html>
