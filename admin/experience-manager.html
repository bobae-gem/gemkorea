<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GemKorea 체험 관리</title>
<link rel="stylesheet" href="shared.css">
<style>
.exp-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.exp-card {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:12px; padding:16px; cursor:pointer; transition:all .15s;
}
.exp-card:hover { border-color:var(--gold); box-shadow:0 2px 12px rgba(200,134,10,.1); }
.exp-id { font-size:10px; color:var(--muted); font-weight:700; margin-bottom:4px; }
.exp-name { font-size:14px; font-weight:900; margin-bottom:6px; }
.exp-meta { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.exp-desc { font-size:11px; color:var(--muted); line-height:1.5; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.exp-info { display:flex; gap:12px; font-size:11px; color:var(--muted); }
.info-item { display:flex; align-items:center; gap:3px; }
.exp-status { display:flex; gap:6px; margin-top:8px; }

/* 상태 뱃지 */
.s-candidate { background:var(--gem-soft); color:var(--gem); border:1px solid rgba(30,58,138,.2); font-size:9px; font-weight:700; padding:2px 7px; border-radius:5px; }
.s-waiting   { background:var(--yellow-soft); color:var(--yellow); border:1px solid rgba(184,134,11,.2); font-size:9px; font-weight:700; padding:2px 7px; border-radius:5px; }
.s-created   { background:var(--green-soft); color:var(--green); border:1px solid rgba(74,140,92,.2); font-size:9px; font-weight:700; padding:2px 7px; border-radius:5px; }

select, input { padding:6px 11px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); color:var(--text); font-size:12px; }
</style>
</head>
<body>
<div class="nav">
  <a href="../admin.html" style="text-decoration:none;"><div class="nav-logo">GemKorea <small>ADMIN</small></div></a>
  <span class="nav-sep">/</span>
  <span class="nav-page">🎭 체험 관리</span>
  <div class="nav-spacer"></div>
  <span class="nav-time" id="now-time"></span>
  <a href="../admin.html" class="nav-link">🏠 홈</a>
</div>

<div class="page-wrap">

  <!-- 운영 확인 모드 토글 -->
  <div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:16px;padding:14px 20px;">
    <div>
      <div style="font-size:13px;font-weight:800;">체험 운영 확인 모드</div>
      <div style="font-size:11px;color:var(--muted);" id="check-mode-desc">현재: OFF — 대표 명령 시에만 실행</div>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
      <span id="last-run-label" style="font-size:10px;color:var(--muted);"></span>
      <button class="btn btn-green" id="btn-check-on" onclick="setCheckMode('ON')" style="display:none;">▶ 운영 확인 시작</button>
      <button class="btn btn-red" id="btn-check-off" onclick="setCheckMode('OFF')" style="display:none;">⏹ 확인 중지</button>
      <div id="mode-badge" style="padding:6px 14px;border-radius:10px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--muted);border:1.5px solid var(--border);">OFF</div>
    </div>
  </div>

  <div class="grid g4" style="margin-bottom:16px;">
    <div class="card"><div class="kpi" id="kpi-total" style="color:var(--gold)">0</div><div class="kpi-label">전체 체험</div></div>
    <div class="card"><div class="kpi" id="kpi-active" style="color:var(--green)">0</div><div class="kpi-label">✅ 운영 확인</div></div>
    <div class="card"><div class="kpi" id="kpi-needs-check" style="color:var(--gem)">0</div><div class="kpi-label">🔍 확인 필요</div></div>
    <div class="card"><div class="kpi" id="kpi-issue" style="color:var(--red)">0</div><div class="kpi-label">⚠️ 이슈 의심</div></div>
  </div>

  <div class="card" style="margin-bottom:14px;">
    <div class="card-head"><span class="card-title">안내</span></div>
    <div style="font-size:12px;line-height:1.8;color:var(--text);">
      체험 데이터는 <strong>역사/자연 마커와 별도로 관리</strong>됩니다.<br>
      • <strong>tour_status = candidate</strong> → 젬투어 상품 후보<br>
      • <strong>shorts_status = waiting</strong> → 숏츠 콘텐츠 제작 대기<br>
      • 체험 데이터는 삭제하지 않고 상태 변경으로만 관리합니다.
    </div>
  </div>

  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
    <select id="filter-sub">
      <option value="">전체 유형</option>
      <option>전통시장</option><option>박물관</option><option>미술관</option>
      <option>한복 체험</option><option>도예/공방 체험</option><option>탈춤/풍물 체험</option>
      <option>사찰 체험</option><option>한옥 숙박</option><option>차 체험</option>
      <option>농촌 체험</option><option>어촌 체험</option><option>체험마을</option>
      <option>축제</option><option>가족 체험</option><option>어린이 체험</option>
    </select>
    <select id="filter-region">
      <option value="">전체 지역</option>
      <option value="SE">서울</option><option value="GG">경기</option><option value="BS">부산</option>
      <option value="GB">경북</option><option value="GN">경남</option><option value="JB">전북</option>
      <option value="JN">전남</option><option value="GW">강원</option><option value="CN">충남</option>
    </select>
    <input id="search" placeholder="체험명 검색..." style="flex:1;min-width:160px;">
  </div>

  <div class="exp-grid" id="exp-list"></div>

</div>

<script>
let exps = [];

async function load() {
  try {
    const r = await fetch('../data/experiences.json');
    const d = await r.json();
    exps = d.experiences || [];
  } catch(e) { exps = []; }
  render();
  ['filter-sub','filter-region','search'].forEach(id =>
    document.getElementById(id).addEventListener('input', render)
  );
}

function render() {
  const fsub = document.getElementById('filter-sub').value;
  const freg = document.getElementById('filter-region').value;
  const fsq  = document.getElementById('search').value.toLowerCase();

  const f = exps.filter(e => {
    if (fsub && e.category_sub !== fsub) return false;
    if (freg && e.region_main !== freg) return false;
    if (fsq && !e.name.toLowerCase().includes(fsq)) return false;
    return true;
  });

  document.getElementById('kpi-total').textContent = exps.length;
  document.getElementById('kpi-active').textContent = exps.filter(e=>e.operation_status==='active').length;
  document.getElementById('kpi-needs-check').textContent = exps.filter(e=>!e.operation_status||e.operation_status==='needs_check'||e.operation_status==='unknown').length;
  document.getElementById('kpi-issue').textContent = exps.filter(e=>['temporarily_closed','ended'].includes(e.operation_status)).length;

  const list = document.getElementById('exp-list');
  if (!f.length) { list.innerHTML = '<div class="empty" style="grid-column:1/-1;">해당 체험이 없습니다</div>'; return; }

  list.innerHTML = f.map(e => `
    <div class="exp-card">
      <div class="exp-id">${e.experience_id}</div>
      <div class="exp-name">${e.name}</div>
      <div class="exp-meta">
        <span class="badge bo">${e.category_sub}</span>
        <span class="badge" style="background:var(--surface2);color:var(--muted);">📍 ${e.region_sub||''}</span>
      </div>
      <div class="exp-desc">${e.short_description||''}</div>
      <div class="exp-info">
        <span class="info-item">💰 ${e.price||'—'}</span>
        <span class="info-item">⏱️ ${e.duration||'—'}</span>
        <span class="info-item">${e.reservation_required?'📋 예약 필요':'🚶 자유 방문'}</span>
      </div>
      ${e.related_heritage_ids?.length ? `<div style="font-size:10px;color:var(--muted);margin-top:6px;">🏛️ 연결 유산: ${e.related_heritage_ids.slice(0,2).join(', ')}${e.related_heritage_ids.length>2?' 외 '+( e.related_heritage_ids.length-2)+'곳':''}</div>` : ''}
      <div class="exp-status">
        <span class="s-${e.operation_status||'needs_check'}" style="${opStyle(e.operation_status)}">${opLabel(e.operation_status)}</span>
        <span class="s-candidate">젬투어: ${e.tour_status}</span>
        <span class="s-waiting">숏츠: ${e.shorts_status}</span>
      </div>
      ${e.last_verified ? `<div style="font-size:9px;color:var(--muted);margin-top:4px;">마지막 확인: ${e.last_verified}</div>` : ''}
    </div>`).join('');
}

function opLabel(s) {
  return {active:'✅ 운영중',temporarily_closed:'⚠️ 임시휴무',ended:'❌ 종료',unknown:'❓ 불명',needs_check:'🔍 확인필요'}[s||'needs_check']||'🔍 확인필요';
}
function opStyle(s) {
  const m={active:'background:var(--green-soft);color:var(--green);border:1px solid rgba(74,140,92,.2)',temporarily_closed:'background:var(--yellow-soft);color:var(--yellow);border:1px solid rgba(184,134,11,.2)',ended:'background:var(--red-soft);color:var(--red);border:1px solid rgba(192,57,43,.2)',unknown:'background:var(--surface2);color:var(--muted);border:1px solid var(--border)',needs_check:'background:var(--gem-soft);color:var(--gem);border:1px solid rgba(30,58,138,.2)'};
  return (m[s||'needs_check']||m.needs_check)+';font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;';
}

async function loadModeStatus() {
  try {
    const r = await fetch('../automation/config.json');
    const c = await r.json();
    const mode = c.operation_check?.mode || 'OFF';
    const lastRun = c.operation_check?.last_run || '';
    const badge = document.getElementById('mode-badge');
    const desc = document.getElementById('check-mode-desc');
    const btnOn = document.getElementById('btn-check-on');
    const btnOff = document.getElementById('btn-check-off');
    const lastLabel = document.getElementById('last-run-label');

    if (mode === 'ON') {
      badge.textContent = 'ON'; badge.style.cssText='padding:6px 14px;border-radius:10px;font-size:12px;font-weight:800;background:var(--green-soft);color:var(--green);border:1.5px solid rgba(74,140,92,.3);';
      desc.textContent = '현재: ON — 우선순위 체험부터 자동 확인 중';
      btnOn.style.display='none'; btnOff.style.display='block';
    } else {
      badge.textContent = 'OFF'; badge.style.cssText='padding:6px 14px;border-radius:10px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--muted);border:1.5px solid var(--border);';
      desc.textContent = '현재: OFF — "체험 운영 체크 켜줘" 명령으로 ON 전환';
      btnOn.style.display='block'; btnOff.style.display='none';
    }
    if (lastRun) lastLabel.textContent = '마지막 실행: '+lastRun;
  } catch(e) {}
}

function setCheckMode(mode) {
  alert((mode==='ON'?'▶ 운영 확인 모드 ON으로 전환합니다.\nClaude Code에서 실제 확인이 실행됩니다.':'⏹ 운영 확인 모드 OFF로 전환합니다.')+'\n\n실제 전환은 Claude Code에서 check_operations.js를 실행해 주세요.\n\n명령어:\nnode automation/check_operations.js '+(mode==='ON'?'on':'off'));
}

function tick(){const n=new Date();document.getElementById('now-time').textContent=n.toLocaleDateString('ko-KR')+' '+n.toLocaleTimeString('ko-KR');}
setInterval(tick,1000);tick();
loadModeStatus();
load();
</script>
</body>
</html>
